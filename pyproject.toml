[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-learning-loop-lab"
version = "1.1.0"
description = "Evidence-first Microsoft Foundry learning-loop workshop"
requires-python = ">=3.11,<3.15"
dependencies = [
  "azure-ai-projects==2.8.0",
  "azure-identity==1.26.0",
  "openai==3.24.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
guide = ["Markdown==3.11"]

[project.scripts]
foundry-lab = "lab.cli:main"

[tool.setuptools]
packages = ["lab"]
