<!doctype html>
<html lang="{{CONTENT_LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="{{WEB_PATH}}/assets/foundry.svg">
  <link rel="stylesheet" href="{{WEB_PATH}}/styles.css">
</head>
<body class="print-book">
  <a class="skip-link" href="#book-main">{{SKIP_LINK}}</a>
  <div class="book-screen-tools no-print">
    <a href="{{HOME_HREF}}">{{RETURN_LABEL}}</a>
    <span>{{PRINT_NOTE}}</span>
    <nav class="language-switcher" aria-label="{{LANGUAGE_NAV_LABEL}}">{{LANGUAGE_LINKS}}</nav>
  </div>
  <main id="book-main" class="book-main" tabindex="-1">
    <header class="book-cover">
      <p class="eyebrow">MICROSOFT FOUNDRY · PRINT EDITION</p>
      <h1>{{TITLE}}</h1>
      <p>{{INTRODUCTION}}</p>
      <p class="book-date">{{DOCUMENT_DATE}} <time datetime="{{BUILD_DATE}}">{{BUILD_DATE}}</time></p>
    </header>
    <nav class="book-toc" aria-labelledby="book-toc-title">
      <h2 id="book-toc-title">{{CONTENTS}}</h2>
      {{BOOK_TOC}}
    </nav>
    {{CONTENT}}
  </main>
</body>
</html>
